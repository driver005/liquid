name: Visual Tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev xvfb scrot xdotool

    - name: Build Storybook
      run: cargo build --example storybook --release

    - name: Run Storybook in Xvfb and Capture Screenshots
      run: |
        # Start Xvfb virtual display
        Xvfb :99 -screen 0 1024x768x24 &
        export DISPLAY=:99

        # Run the storybook app in the background
        ./target/release/examples/storybook &
        APP_PID=$!

        # Wait for the app to boot
        sleep 3

        # Create output directory for screenshots
        mkdir -p screenshots

        # Array of components (Assuming 9 components based on storybook.rs)
        # We will use xdotool to simulate clicking the down arrow to navigate
        # if we added keyboard navigation, or just click coordinates.
        # For simplicity, we just take a screenshot of the default view for now.
        
        echo "Taking initial screenshot (Button page)..."
        scrot screenshots/01_button.png

        # Simulate clicking the next item in the sidebar using xdotool
        for i in {2..9}
        do
           echo "Navigating to component $i..."
           # Click coordinates: x=100 (sidebar), y=(i * 30 + offset)
           Y_POS=$(( 15 + i * 35 ))
           xdotool mousemove 100 $Y_POS click 1
           sleep 1
           scrot screenshots/0${i}_component.png
        done

        # Kill the app
        kill $APP_PID

    - name: Upload Screenshots Artifact
      uses: actions/upload-artifact@v7
      with:
        name: component-screenshots
        path: screenshots/
